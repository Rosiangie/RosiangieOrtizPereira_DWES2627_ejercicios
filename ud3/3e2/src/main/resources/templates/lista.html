<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>Listado de numeros</h1>
<table>
    <thead>
    <tr>
        Número
    </tr>
    </thead>
    <tbody>
    <tr th:each="numero : ${lista}">
        <td th:text="${numero}"></td>
    </tr>
    </tbody>
    <p th:text="${total}">Total</p>

</table>

</body>
</html>
