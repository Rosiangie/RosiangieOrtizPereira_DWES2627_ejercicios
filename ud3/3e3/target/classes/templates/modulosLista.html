<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1>Listado Modulos</h1>
    <form method="get" th:action="@{/modulos}">Elige Curso<form>
        <select name="curso">
            <option value="1"> 1er año
            </option>
            <option value="2"> 2do año</option>
        </select>

    <div class="filtros">
        <a th:href="@{/modulos}">Todos</a>
        <a th:href="@{/modulos(curso=1)}">Modulos de primero</a>
        <a th:href="@{/modulos(curso=2)}">Modulos de segundo</a>
    </div>

    <ul>
        <li th:each="modulo: ${modulos}" th:text="${modulo.nombre}"></li>
    </ul>
</body>
</html>
